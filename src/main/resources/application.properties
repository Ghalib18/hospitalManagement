spring.application.name=hospitalManagement


#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital
spring.datasource.username=postgres
spring.datasource.password=Random123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# seeding the data in database

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.data-location=classpath:data.sql